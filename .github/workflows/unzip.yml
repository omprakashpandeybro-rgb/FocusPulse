name: Unzip Folders
on: push

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Unzip gradle and app
        run: |
          if [ -f "gradle.zip" ]; then
            unzip -o gradle.zip
            rm gradle.zip
          fi
          if [ -f "app.zip" ]; then
            unzip -o app.zip
            rm app.zip
          fi
          # cleanup if zips were inside folders
          if [ -f "gradle/gradle.zip" ]; then unzip -o gradle/gradle.zip -d gradle/ && rm gradle/gradle.zip; fi
          if [ -f "app/app.zip" ]; then unzip -o app/app.zip -d app/ && rm app/app.zip; fi
          ls -la

      - name: Commit unzipped files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto unzip gradle and app folders"
            git push
          else
            echo "Already unzipped"
          fi
